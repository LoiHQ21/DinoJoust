name: Crownfall test build
on:
  push:
    branches: ['test-build/**']
    paths: ['game/**', '.github/workflows/joust-build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.3 and release templates
        shell: bash
        run: |
          set -eu
          release=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl --fail --location --retry 3 "$release/Godot_v4.6.3-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/editor.zip"
          unzip -q "$RUNNER_TEMP/editor.zip" -d "$RUNNER_TEMP/editor"
          mv "$RUNNER_TEMP/editor/Godot_v4.6.3-stable_linux.x86_64" "$RUNNER_TEMP/editor/godot"
          echo "$RUNNER_TEMP/editor" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 "$release/Godot_v4.6.3-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.zip"
          templates="$HOME/.local/share/godot/export_templates/4.6.3.stable"
          mkdir -p "$templates"
          unzip -jq "$RUNNER_TEMP/templates.zip" 'templates/android_release.apk' 'templates/windows_release_x86_64.exe' 'templates/web_nothreads_release.zip' 'templates/version.txt' -d "$templates"
      - name: Exercise duel and scene input
        working-directory: game
        run: |
          godot --headless --editor --import
          godot --headless --script tests/duel_test.gd
          godot --headless --script tests/play_test.gd
      - name: Export desktop and web builds
        working-directory: game
        run: |
          mkdir -p ../builds/{windows,web}
          godot --headless --export-release 'Windows Desktop'
          godot --headless --export-release Web
          for target in windows web; do
            cp NOTICE.txt art/Cinzel-OFL.txt "../builds/$target/"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Crownfall-Windows-x64
          path: builds/windows/
      - uses: actions/upload-artifact@v4
        with:
          name: Crownfall-Web
          path: builds/web/
      - name: Sign and verify Android playtest
        working-directory: game
        shell: bash
        run: |
          mkdir -p ../builds/android
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/playtest.p12"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=playtest
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -alias playtest -keyalg RSA -keysize 2048 -validity 3650 \
            -storetype PKCS12 -keystore "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" \
            -storepass:env GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD -dname 'CN=Crownfall Playtest'
          godot --headless --export-release 'Android Playtest'
          build_tools=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$build_tools" verify --verbose ../builds/android/Crownfall-Playtest.apk
          "${build_tools%/*}/aapt" dump badging ../builds/android/Crownfall-Playtest.apk
      - uses: actions/upload-artifact@v7
        with:
          path: builds/android/Crownfall-Playtest.apk
          archive: false
          if-no-files-found: error
  android-smoke:
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: Crownfall-Playtest.apk
          path: builds/android
          skip-decompress: true
      - name: Prepare emulator and screen reader for the smoke test
        run: |
          sudo chmod a+rw /dev/kvm
          if ! command -v tesseract >/dev/null || ! command -v convert >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y tesseract-ocr imagemagick
          fi
      - name: Complete a crown duel and start a rematch on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim
          script: bash game/tests/android_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-playtest-screens
          path: builds/android/screens/
          if-no-files-found: ignore
  windows-smoke:
    needs: export
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Crownfall-Windows-x64
      - name: Launch the exported game
        shell: pwsh
        run: |
          $game = Start-Process -FilePath .\Crownfall.exe -ArgumentList '--headless','--quit-after','30','--log-file','smoke.log' -PassThru
          if (-not $game.WaitForExit(60000)) { $game.Kill(); throw "Game launch timed out" }
          Get-Content smoke.log
          if ($game.ExitCode -ne 0 -or (Select-String smoke.log -Pattern 'SCRIPT ERROR|^ERROR:')) { throw "Game failed its launch check" }
